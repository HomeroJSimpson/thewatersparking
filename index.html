<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site check-in</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a6f6a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Check-in">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#12212b;--mute:#566673;--line:#c9d6de;--acc:#0a6f6a;--acc-ink:#fff;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e171d;--card:#16242d;--ink:#e8f0f4;--mute:#9db0bc;--line:#2c4150;--acc:#3cc4b8;--acc-ink:#062a27;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e171d;--card:#16242d;--ink:#e8f0f4;--mute:#9db0bc;--line:#2c4150;--acc:#3cc4b8;--acc-ink:#062a27;--bad:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.9rem;line-height:1.1;margin:8px 0 6px;font-weight:800;letter-spacing:-.02em}
.lead{color:var(--mute);margin:0 0 20px}
fieldset{border:0;margin:0 0 14px;padding:16px;background:var(--card);border-radius:14px;border:1px solid var(--line)}
legend,label.q{display:block;font-weight:600;margin:0 0 10px;padding:0}
legend{float:left;width:100%}legend+*{clear:both}
input[type=text],input[type=date],input[type=time]{min-height:48px;width:100%;font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:12px}
input[type=text]:focus,input[type=date]:focus,input[type=time]:focus,.opt:focus-within,.snap:focus-within{outline:3px solid var(--acc);outline-offset:1px}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 12px;margin-top:8px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.opt input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.opt:has(input:checked){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.field{margin-bottom:14px}
.snap{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border:2px dashed var(--acc);border-radius:12px;font-weight:600;color:var(--acc);cursor:pointer;text-align:center;padding:10px}
.snap input{position:absolute;opacity:0;width:1px;height:1px}
#preview{display:none;width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin-top:12px}
#retake{display:none;margin-top:8px;background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;padding:8px 0}
.send{width:100%;min-height:54px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.send:disabled{opacity:.6}
.ghost{width:100%;min-height:48px;margin-top:10px;background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;font:inherit;cursor:pointer}
#status{min-height:1.5em;margin-top:14px;font-weight:600}
#status.err{color:var(--bad)}
.hint{font-size:.85rem;color:var(--mute);margin-top:18px}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p class="lead" id="intro"></p>
<form id="f" novalidate>
  <div id="fields"></div>
  <button class="send" id="send" type="submit"></button>
  <button class="ghost" id="copy" type="button"></button>
  <div id="status" role="status" aria-live="polite"></div>
  <p class="hint" id="hint"></p>
</form>
</main>


<script type="application/json" id="config">
{
  "title": "The Waters Parking Violation Report",
  "intro": "Fill this form to submit a parking violation incident.",
  "emailTo": "developer@outlook.com",
  "emailSubject": "The Waters Parking Violation: {plate} {date} {time}",
  "sheetUrl": "",
  "hint": "On a phone, “Send report” opens your share sheet so you can pick Mail with the photo attached.",
  "buttons": {
    "send": "Send report",
    "copy": "Copy summary",
    "takePhoto": "Take a photo",
    "retakePhoto": "Retake photo",
    "removePhoto": "Remove photo"
  },
  "messages": {
    "missing": "Please fill in: {fields}",
    "sending": "Sending…",
    "sentSheet": "Sent to the sheet. Thank you!",
    "shared": "Shared. Thank you!",
    "opening": "Opening your email app…",
    "cancelled": "Cancelled.",
    "failed": "Couldn’t send. Check your connection and try again.",
    "copied": "Summary copied.",
    "copyFailed": "Couldn’t copy on this browser.",
    "attachManually": "(Attach your photo manually in this email.)"
  },
  "fields": [
    {
      "id": "name",
      "type": "text",
      "label": "Your name",
      "required": true,
      "autocomplete": "name"
    },
    {
      "id": "date",
      "type": "date",
      "label": "Date",
      "required": true,
      "default": "now"
    },
    {
      "id": "time",
      "type": "time",
      "label": "Time",
      "required": true,
      "default": "now"
    },
    {
      "id": "parking-permit",
      "type": "text",
      "digitsOnly": true,
      "maxlength": 2,
      "label": "The Waters parking permit number",
      "placeholder": "e.g. 99"
    },
    {
      "id": "plate",
      "type": "text",
      "uppercase": true,
      "label": "Vehicle license plate",
      "maxlength": 7,
      "required": true,
      "placeholder": "e.g. 1ABC234"
    },
    {
      "id": "state",
      "type": "text",
      "uppercase": true,
      "label": "License plate state",
      "maxlength": 2,
      "placeholder": "e.g. CA, OR, WA, NV, etc.",
      "default": "CA"
    },
    {
      "id": "notes",
      "type": "text",
      "label": "Anything else? (one line)",
      "maxlength": 140
    },
{
      "id": "reasons",
      "type": "checkbox",
      "label": "Vehicle improperly parked due to (check all that apply)",
      "options": [
        "Vehicle has NO VALID PARKING PERMIT",
        "Parked in DISABLED PERSONS' space/area",
        "Parked in NO PARKING space/area",
        "Parked in RESERVED OR DESIGNATED space/area",
        "Parked in 2 SPACES",
        "Blocking DRIVEWAY OR ACCESS"
      ]
    },
 {
     "id": "photo",
      "type": "photo",
      "label": "Photo",
      "required": false
    }
  ]
}
</script>
<script>
// Config: edit the JSON block above, or put a form.config.json next to this file
// (when self-hosted, that file overrides the embedded block).
var C, f = document.getElementById("f"), st = document.getElementById("status");
var blob = null, thumb = "";
function el(t, p, kids){ var n = document.createElement(t); for (var k in (p||{})) { if (k === "text") n.textContent = p[k]; else n.setAttribute(k, p[k]); } (kids||[]).forEach(function(c){ n.appendChild(c); }); return n; }
function say(msg, bad){ st.textContent = msg; st.className = bad ? "err" : ""; }
function M(k){ return (C.messages && C.messages[k]) || ""; }
function B(k){ return (C.buttons && C.buttons[k]) || ""; }

function build(){
  document.title = C.title;
  document.getElementById("title").textContent = C.title;
  document.getElementById("intro").textContent = C.intro || "";
  document.getElementById("hint").textContent = C.hint || "";
  document.getElementById("send").textContent = B("send");
  document.getElementById("copy").textContent = B("copy");
  var box = document.getElementById("fields"); box.innerHTML = "";
  C.fields.forEach(function(fd){
    var fs = el("fieldset", {"data-id": fd.id});
    if (fd.type === "text" || fd.type === "date" || fd.type === "time") {
      fs.appendChild(el("label", {"class":"q", "for":"f_"+fd.id, text: fd.label}));
      var i = el("input", {type:fd.type, id:"f_"+fd.id, name:fd.id});
      if (fd.placeholder) i.placeholder = fd.placeholder;
      if (fd.maxlength) i.maxLength = fd.maxlength;
      if (fd.autocomplete) i.autocomplete = fd.autocomplete;
      if (fd.digitsOnly) { i.inputMode = "numeric"; i.setAttribute("pattern", "[0-9]*");
        i.addEventListener("input", function(){ var c = i.value.replace(/\D/g, ""); if (c !== i.value) i.value = c; }); }
      if (fd.uppercase) { i.setAttribute("autocapitalize", "characters"); i.style.textTransform = "uppercase";
        i.addEventListener("input", function(){ var s = i.selectionStart, u = i.value.toUpperCase();
          if (u !== i.value) { i.value = u; try { i.setSelectionRange(s, s); } catch(e){} } }); }
      if (fd.default === "now") { var n = new Date(), z = function(x){ return ("0"+x).slice(-2); };
        if (fd.type === "date") i.setAttribute("value", n.getFullYear()+"-"+z(n.getMonth()+1)+"-"+z(n.getDate()));
        if (fd.type === "time") i.setAttribute("value", z(n.getHours())+":"+z(n.getMinutes())); }
      fs.appendChild(i);
    } else if (fd.type === "radio" || fd.type === "checkbox") {
      fs.appendChild(el("legend", {text: fd.label}));
      fd.options.forEach(function(o){
        var inp = el("input", {type: fd.type, name: fd.id, value: o});
        fs.appendChild(el("label", {"class":"opt"}, [inp, el("span", {text:o})]));
      });
    } else if (fd.type === "photo") {
      fs.appendChild(el("legend", {text: fd.label}));
      var t = el("span", {id:"snapText", text: B("takePhoto")});
      var inp = el("input", {type:"file", id:"photo", accept:"image/*", capture:"environment"});
      fs.appendChild(el("label", {"class":"snap"}, [t, inp]));
      fs.appendChild(el("img", {id:"preview", alt:""}));
      fs.appendChild(el("button", {type:"button", id:"retake", text: B("removePhoto")}));
    }
    box.appendChild(fs);
  });
  // Prefill from the URL, e.g. ?name=Alex%20Kim&where=Room%20204 (any field id works)
  var q = new URLSearchParams(location.search);
  C.fields.forEach(function(fd){
    if (!q.has(fd.id)) return;
    var v = q.get(fd.id).trim(); if (fd.uppercase) v = v.toUpperCase(); 
    if (fd.digitsOnly) 
      v = v.replace(/\D/g, "").slice(0, fd.maxlength || 99);
    if (fd.type === "text" || fd.type === "date" || fd.type === "time") {
      var i = f.querySelector("[name="+fd.id+"]"); if (i) { i.setAttribute("value", v); i.value = v; }
    } else if (fd.type === "radio" || fd.type === "checkbox") {
      var want = v.split(",").map(function(x){ return x.trim(); });
      Array.prototype.forEach.call(f.querySelectorAll("input[name="+fd.id+"]"), function(x){
        if (want.indexOf(x.value) > -1) { x.setAttribute("checked", ""); x.checked = true; }
      });
    }
  });
  bindPhoto();
}

function bindPhoto(){
  var inp = document.getElementById("photo"); if(!inp) return;
  var rt = document.getElementById("retake"), pv = document.getElementById("preview"), tx = document.getElementById("snapText");
  inp.addEventListener("change", function(e){
    var file = e.target.files && e.target.files[0]; if(!file) return;
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      function render(max, q, cb){
        var s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); cb(c, q);
      }
      render(1200, .75, function(c, q){ c.toBlob(function(b){ blob = b; }, "image/jpeg", q); pv.src = c.toDataURL("image/jpeg", q); pv.style.display = "block"; });
      render(640, .6, function(c, q){ thumb = c.toDataURL("image/jpeg", q); });
      rt.style.display = "inline-block"; tx.textContent = B("retakePhoto"); URL.revokeObjectURL(url);
    };
    img.src = url;
  });
  rt.addEventListener("click", function(){
    blob = null; thumb = ""; inp.value = ""; pv.style.display = "none"; rt.style.display = "none"; tx.textContent = B("takePhoto");
  });
}

function collect(){
  var out = [];
  C.fields.forEach(function(fd){
    if (fd.type === "photo") return;
    var v = "";
    if (fd.type === "text" || fd.type === "date" || fd.type === "time") v = f.querySelector("[name="+fd.id+"]").value.trim(); if (fd.uppercase) v = v.toUpperCase();
    if (fd.type === "radio") { var r = f.querySelector("input[name="+fd.id+"]:checked"); v = r ? r.value : ""; }
    if (fd.type === "checkbox") v = Array.prototype.map.call(f.querySelectorAll("input[name="+fd.id+"]:checked"), function(x){ return x.value; }).join(", ");
    out.push({id: fd.id, label: fd.label, value: v, required: !!fd.required});
  });
  return out;
}
function summary(vals){
  var lines = [C.title, "Submitted: " + new Date().toLocaleString()];
  vals.forEach(function(v){ lines.push(v.label + ": " + (v.value || "—")); });
  lines.push("Photo: " + (blob ? "attached" : "none"));
  return lines.join("\n");
}
function fill(s, vals){ return s.replace(/\{(\w+)\}/g, function(m, id){ var x = vals.filter(function(v){ return v.id === id; })[0]; return x ? x.value : m; }); }

document.getElementById("copy").addEventListener("click", function(){
  try { navigator.clipboard.writeText(summary(collect())).then(function(){ say(M("copied")); }, function(){ say(M("copyFailed"), true); }); }
  catch(e){ say(M("copyFailed"), true); }
});

f.addEventListener("submit", async function(e){
  e.preventDefault();
  var vals = collect();
  var miss = vals.filter(function(v){ return v.required && !v.value; }).map(function(v){ return v.label; });
  if (miss.length) { say(M("missing").replace("{fields}", miss.join(", ")), true); return; }
  var btn = document.getElementById("send"); btn.disabled = true; say(M("sending"));
  try {
    if (C.sheetUrl) {
      await fetch(C.sheetUrl, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"},
        body: JSON.stringify({time:new Date().toLocaleString(), labels: vals.map(function(v){return v.label;}), values: vals.map(function(v){return v.value;}), photo: thumb})});
      say(M("sentSheet")); f.reset(); var rt = document.getElementById("retake"); if (rt) rt.click();
    } else if (blob && navigator.canShare) {
      var file = new File([blob], "photo.jpg", {type:"image/jpeg"});
      if (!navigator.canShare({files:[file]})) throw new Error("nofiles");
      await navigator.share({title: C.title, text: summary(vals), files:[file]});
      say(M("shared"));
    } else { throw new Error("nofiles"); }
  } catch(err) {
    if (err && err.name === "AbortError") say(M("cancelled"));
    else if (C.sheetUrl) say(M("failed"), true);
    else {
      location.href = "mailto:" + C.emailTo + "?subject=" + encodeURIComponent(fill(C.emailSubject || C.title, vals)) +
        "&body=" + encodeURIComponent(summary(vals) + (blob ? "\n\n" + M("attachManually") : ""));
      say(M("opening"));
    }
  }
  btn.disabled = false;
});

(async function(){
  C = JSON.parse(document.getElementById("config").textContent);
  try {
    var ctl = new AbortController(), t = setTimeout(function(){ ctl.abort(); }, 1500);
    var r = await fetch("form.config.json", {signal: ctl.signal, cache:"no-cache"}); clearTimeout(t);
    if (r.ok) C = await r.json();
  } catch(e) {}
  build();
})();
if ("serviceWorker" in navigator) { window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script>
</body>
</html>
